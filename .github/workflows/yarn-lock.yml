name: Yarn Lock

# The lock file only moves when the Kotlin/Compose toolchain or an npm dependency
# changes, so this runs on the merges that can cause it rather than on a timer,
# which would be a no-op on almost every run.
on:
  push:
    branches: [ "main" ]
    paths:
      - gradle/libs.versions.toml
      - composeApp/build.gradle.kts
  workflow_dispatch:

concurrency:
  group: yarn-lock
  cancel-in-progress: true

jobs:
  update:
    name: Update yarn.lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}

      # Checkout also uses the App token so the branch push comes from the App.
      # A push made with GITHUB_TOKEN would not trigger CI on the resulting pull
      # request, which would leave the lock update unverified.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'jetbrains'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # Only the wasm lock file is tracked. The js target's lock file is not
      # committed, so kotlinUpgradeYarnLock is deliberately not run here.
      - name: Update yarn.lock
        run: ./gradlew kotlinWasmUpgradeYarnLock

      # No-op when the lock file already matches; reuses the branch and the open
      # pull request when a later bump lands before the previous one is merged.
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: kotlin-js-store/wasm/yarn.lock
          branch: chore/update-yarn-lock
          delete-branch: true
          commit-message: 'build(deps): update yarn.lock'
          title: 'build(deps): update yarn.lock'
          body: |
            The wasm `yarn.lock` no longer matched the npm dependencies the build resolves, so it was regenerated by running `./gradlew kotlinWasmUpgradeYarnLock`.

            Without this, `wasmJsTest` and `wasmJsBrowserDistribution` fail on a lock file mismatch.
